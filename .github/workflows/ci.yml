name: Lazarus Indexer & Attestation Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Django System Check, Migrations & DRF Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lazarus
          POSTGRES_USER: lazarus
          POSTGRES_PASSWORD: lazarus_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      LAZARUS_DB_ENGINE: postgres
      POSTGRES_DB: lazarus
      POSTGRES_USER: lazarus
      POSTGRES_PASSWORD: lazarus_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      LAZARUS_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Verify no unapplied model migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply database migrations against PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run Indexer & Attestation CBV test suite
        run: python manage.py test indexer --verbosity=2
